name: bible_demo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter

  get:
  flutter_svg:
  smooth_page_indicator:
  linear_progress_bar:
  image_picker:
  http:
  shared_preferences:
  device_info_plus:


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true


  assets:
    - assets/splash_img/
    - assets/Icon_img/
    - assets/bottomnavigation_img/
    - assets/Event/
    - assets/EventIcon/
    - assets/Bible/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700


